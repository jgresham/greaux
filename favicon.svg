<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0d0d14"/>
  <!-- Growing bars, anchored at bottom (y=31), increasing heights -->
  <rect x="1"  y="23" width="6" height="8"  rx="1.5" fill="#e8ff47" fill-opacity="0.45"/>
  <rect x="9"  y="17" width="6" height="14" rx="1.5" fill="#e8ff47" fill-opacity="0.65"/>
  <rect x="17" y="9"  width="6" height="22" rx="1.5" fill="#e8ff47" fill-opacity="0.85"/>
  <rect x="25" y="1"  width="6" height="30" rx="1.5" fill="#e8ff47"/>
  <!-- Trend line connecting bar tops -->
  <polyline points="4,23 12,17 20,9 28,1" stroke="#e8ff47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
</svg>
